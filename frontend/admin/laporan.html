<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan - SIMORA</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/laporan.css">
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<template id="tpl-laporan">
  <div class="page-header">
    <div>
      <h1>Laporan Rental</h1>
      <p>Rekap transaksi rental berdasarkan periode dan cabang</p>
    </div>
  </div>

  <div class="card filter-card">
    <div class="filter-row">
      <div class="form-group">
        <label>Dari Tanggal</label>
        <input type="date" class="input-field" id="filterTglMulai">
      </div>
      <div class="form-group">
        <label>Sampai Tanggal</label>
        <input type="date" class="input-field" id="filterTglAkhir">
      </div>
      <div class="form-group">
        <label>Cabang</label>
        <select class="select-field" id="filterCabangLaporan">
          <option value="">Semua Cabang</option>
          <option value="Pusat">Pusat</option>
          <option value="Bandung">Bandung</option>
          <option value="Garut">Garut</option>
          <option value="Tasikmalaya">Tasikmalaya</option>
        </select>
      </div>
      <div class="form-group filter-btn-group">
        <label>&nbsp;</label>
        <button class="btn btn-primary" id="btnTerapkanFilter"><i class="fa-solid fa-filter"></i> Terapkan</button>
      </div>
    </div>
    <div class="export-row">
      <button class="btn btn-outline" id="btnCetak"><i class="fa-solid fa-print"></i> Cetak</button>
      <button class="btn btn-danger" id="btnExportPdf"><i class="fa-solid fa-file-pdf"></i> Export PDF</button>
      <button class="btn btn-success" id="btnExportExcel"><i class="fa-solid fa-file-excel"></i> Export Excel</button>
    </div>
  </div>

  <div class="stat-grid" style="grid-template-columns: repeat(4, 1fr); margin: 24px 0;">
    <div class="card stat-card">
      <div class="stat-icon icon-blue"><i class="fa-solid fa-file-signature"></i></div>
      <div class="stat-info"><span>Total Transaksi</span><h3 id="lapTotalTransaksi">0</h3></div>
    </div>
    <div class="card stat-card">
      <div class="stat-icon icon-primary"><i class="fa-solid fa-sack-dollar"></i></div>
      <div class="stat-info"><span>Total Pendapatan</span><h3 id="lapTotalPendapatan">Rp 0</h3></div>
    </div>
    <div class="card stat-card">
      <div class="stat-icon icon-warning"><i class="fa-solid fa-money-bill-transfer"></i></div>
      <div class="stat-info"><span>Total Denda</span><h3 id="lapTotalDenda">Rp 0</h3></div>
    </div>
    <div class="card stat-card">
      <div class="stat-icon icon-success"><i class="fa-solid fa-car"></i></div>
      <div class="stat-info"><span>Mobil Ter-rental</span><h3 id="lapTotalMobil">0</h3></div>
    </div>
  </div>

  <div class="card" id="printArea">
    <div class="card-head">
      <div>
        <h3>Rekap Transaksi Rental</h3>
        <p id="lapPeriodeLabel">Seluruh periode</p>
      </div>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>No</th><th>Customer</th><th>Mobil</th><th>Cabang</th>
            <th>Tgl Rental</th><th>Tgl Kembali</th><th>Status</th><th>Total Biaya</th>
          </tr>
        </thead>
        <tbody id="laporanTableBody"></tbody>
      </table>
    </div>
  </div>
</template>

<script src="js/common.js"></script>
<script src="js/laporan.js"></script>
</body>
</html>
