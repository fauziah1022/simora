<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Petugas - SIMORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-wrapper">

  <!-- Panel Kiri -->
  <div class="login-left">
    <div class="left-overlay"></div>
    <div class="left-content">
      <div class="brand-mark">
        <div class="brand-icon">
          <img src="img/logo.png" alt="Logo SIMORA" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
          <i class="fa-solid fa-car-side" style="display:none;"></i>
        </div>
        <h1>SIMORA</h1>
      </div>
      <div class="car-showcase">
        <img src="img/pajero.jpg" alt="Mobil Rental" id="carImage" onerror="this.style.display='none'; document.getElementById('carFallback').style.display='flex';">
        <div class="car-fallback" id="carFallback">
          <i class="fa-solid fa-car-side"></i>
        </div>
      </div>
      <div class="left-caption">
        <h2>Layani Rental Mobil Lebih Cepat</h2>
        <p>Kelola rental, customer, dan pengembalian mobil langsung dari counter cabang Anda.</p>
      </div>
      <div class="left-stats">
        <div class="stat-item">
          <strong>4</strong>
          <span>Cabang Aktif</span>
        </div>
        <div class="stat-item">
          <strong>120+</strong>
          <span>Unit Mobil</span>
        </div>
        <div class="stat-item">
          <strong>99.9%</strong>
          <span>Uptime Sistem</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Panel Kanan -->
  <div class="login-right">
    <div class="login-card">
      <div class="login-card-header">
        <div class="mobile-logo">
          <div class="brand-icon-sm"><i class="fa-solid fa-car-side"></i></div>
          <span>SIMORA</span>
        </div>
        <h2>Welcome Back</h2>
        <p>Silakan login Petugas</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group-login">
          <label for="username">Username</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" name="username" placeholder="Masukkan username" autocomplete="username" required>
          </div>
        </div>

        <div class="form-group-login">
          <label for="password">Password</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" id="togglePass"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <div id="loginError" class="login-error"></div>

        <div class="form-options">
          <label class="checkbox-wrap">
            <input type="checkbox" id="rememberMe">
            <span>Ingat saya</span>
          </label>
          <a href="#" class="forgot-link">Lupa password?</a>
        </div>

        <button type="submit" class="btn-login">
          <span id="loginBtnText">Login</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>

      </form>

      <p class="login-footer-text">&copy; 2026 SIMORA. Seluruh hak cipta dilindungi.</p>
    </div>
  </div>

</div>

<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
